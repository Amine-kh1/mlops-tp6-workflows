name: pipeline-mlops

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Installer les dépendances
        run: python -m pip install -r requirements-ci.txt
      - name: Recréer les données v2
        run: |
          python donnees.py
          python nouvelles_donnees.py
      - name: Rejouer le pipeline
        run: dvc repro
      - name: Vérifier la règle de qualité
        run: python verifier_qualite.py
      - name: Conserver les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports
          path: reports/
